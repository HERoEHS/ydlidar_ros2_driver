ydlidar_rear/ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar_rear
    frame_id: rear_lidar_link  # the URDF link (alice_common m2_sensors.xacro)
    # Body occlusion in scan angles [deg]. 110 -> 112 (2026-10-07): the beam at 110.3 deg
    # grazed the body edge and gave a point 0.15 m away in 3-6 % of the scans, on both lidars.
    # 112 -> 115, rear only (2026-10-29): the beams at 112.9-114.5 deg hit the body 0.36-0.38 m away
    # (2.5 cm inside the footprint rear edge) at the same body spot in three stops at different
    # places (0.06-0.71 points a scan). The front lidar showed none. The body blocks that
    # direction at 0.37 m anyway, so nothing beyond it is lost.
    ignore_array: "17,115"
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 4
    intensity_bit: 8
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    inverted: false
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.03
    frequency: 10.0
    invalid_range_is_inf: false
